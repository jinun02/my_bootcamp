<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 
    DOM요소의 속성을 다루는 공통 함수에 대해서 알아봅시다
    getAttribute() : 요소의 속성 값 get
    setAttribute() : 요소의 속성값 set
    removeAttribute() : 지정된 속성 제거
    hasAttribute() : 지정된 속성이 있는지 체크
    toggleAttribute() : 요소에 부을 속성 추가/ 제거 상태변경

    -->
    <style>
        .bg {
            background-color: yellowgreen;
        }
    </style>
</head>

<body>
    <video src="../medias/flight.mp4" autoplay loop></video>

        속성 자체가 값인 경우엔 존재하면 ""을, 선언 자체가 안되어있으면 null을 리턴한다  
        -->
