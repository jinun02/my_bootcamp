<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 
        쿠키를 이용한 팝업 재어하기..

    -->

    <style>
        /* 팝업 스타일 스타일링 */
        .popup-overlay {
            display: none;
            /* 기본값은 숨김, JS로 제어 */
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -20%);
            width: 300px;
            background: #ffffff;
            border: 1px solid #ccc;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .popup-content {
            padding: 20px;
            text-align: center;
        }

        .popup-footer {
            background: #f1f1f1;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .close-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="mainPopup" class="popup-overlay">
        <div class="popup-content">
            <h3>📢 공지사항</h3>
            <p>오늘의 특별 이벤트를 확인하세요!</p>
        </div>
        <div class="popup-footer">
            <label>
                <input type="checkbox" id="dontShowToday"> 오늘 하루 보지 않기
            </label>
            <button class="close-btn" onclick="closePopup()">닫기</button>
        </div>
    </div>

    <script>
        window.onload=function(){
            // 팝업 제어하는 쿠키가 존재하는지의 여부를 판단하는 getcookie함수를
            // 호출해서 찾고자하는 쿠키(name)의 값이 존재하는지를 확인해 봅시다
            if(!getCookie('hidePopup')){
                document.getElementById('mainPopup').style.display='block';
            }
        }

        function closePopup(){
            const checkbox=document.getElementById("dontShowToday");

            // 체크박스가 체크 되었다면 오늘 자정까지 안보이게
            if(checkbox.checked){
                setCookieMidnight("hidePopup","true");
            }
            document.getElementById('mainPopup').style.display='none';
        }

        function setCookieMidnight(name,value){
            const now = new Date();
            const midnight=new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate()+1,
                0,0,0,0
            );
            const maxAge = Math.floor((midnight.getTime()-now.getTime())/1000);
                document.cookie = name+"="+encodeURIComponent(value)+"; max-age="+maxAge+"; path=/";
        }

        function getCookie(name){
            const cookieName = name+'=';
            // 쿠키를 전송할떄 Encoding 해서 보낼겁니다.
            // 따라서 가져온 쿠키도 Decoding해서 찾아내야합니다.
            const decodedCoKkie=decodeURIComponent(document.cookie);
            const cookieArray=decodedCoKkie.split(";");


            for(let i=0; i<cookieArray.length; i++){
                let cookie=cookieArray[i].trim();

                if(cookie.indexOf(cookieName)===0){
                    // 찾는 쿠키의 키가 존재한다면
                    return cookie.substring(cookieName.length,cookie.length);
                }else{
                    console.log('해당쿠키 있음')
                }
            }
            return '';
        }
    </script>
</body>

</html>
