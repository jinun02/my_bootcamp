<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark {
            background-color: #1a1a1a;
            color: #f1f1f1;
        }
    </style>
</head>

<body>

    <div class="content">
        <h1>현재 테마: 라이트 모드</h1>
        <p>버튼을 누르면 다크모드로 바뀝니다.</p>
        <button id="themeBtn">다크모드 켜기</button>
    </div>


    <script>
        const themeBtn = document.getElementById("themeBtn");
        const heading = document.querySelector("h1");
        const desc = document.querySelector("p");

        themeBtn.addEventListener("click",()=>{
            document.body.classList.toggle("dark");

            const isDark = document.body.classList.contains("dark");

            heading.textContent=isDark? "현재 테마: 다크 모드":"현재 테마: 라이트 모드";
            desc.textContent=isDark? "버튼을 누르면 라이트모드로 바뀝니다.":"버튼을 누르면 다크모드로 바뀝니다.";
            themeBtn.textContent = isDark ? "라이트모드 켜기" : "다크모드 켜기";

        })
    </script>

</body>

</html>
