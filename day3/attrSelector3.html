<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--
        3. attr*=값 선택자 : [attr*="value"] : 뒤의 value 문자열을 포함하는 모든 요소를 선택함.
    
        ex> [class*="alert"] class="alert caution", class="warn-alert"

        4. attr~=값 선택자 : [attr~="value"] : 속성이 value 라는 단어를 포함하는 값이 있는 
        모든 요소를 선택함

        5. attr^=값 : 속성의 값이 value 로 시작하는 모든 요소를 찾음.
        6. attr$=값 : 5번과 반대임.
    
        -->
    <style>
        [href^="#"] {
            background-color: black;
            color: aliceblue;
        }

        [href^="#"]::after {
            content: "😎";
        }
    </style>
</head>

<body>
    <p class="alert caution">alert caution</p>
    <p class="warning alert">warning alert</p>
    <p class="alert-caution">alert-caution</p>
    <p class="alertcaution">alertcaution</p>
    <p class="warning-alert">warning-alert</p>
    <p class="warningalert">warningalert</p>
    <p class="alert">alert</p>
    <p class="awesome">awesome</p>

    <p>다음의 링크를 참조하세요.</p>
    <ul>
        <li><a href="#subject-1">주제-1</a></li>
        <li><a href="#contact">연락</a></li>
        <li><a href="https://example.com/">Example Domain</a></li>
    </ul>

</body>

</html>
