<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>

    <style>
        p{
            color: olive;
        }
        .highlight{
            background-color: yellow;
        }
        #intro{
            font-size: 20px;
        }

    </style>
</head>
<body>
    <p id="intro">CSS Selectors</p>
    <p>이건 일반 구문</p>
    <p class="highlight">이 구문은 하이라이트</p>

    <!-- 위 구문에서 intro 부분은 폰트크기가 20px로 ,highlight부분은 
     배경색을 노란색으로, 일반 구문은 폰트컬러를 올리브로 선언해보시오 -->


</body>
</html>
