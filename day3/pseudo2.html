<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        input {
            padding: 0.5em;
            border: 2px solid blue;
            outline: none;
            outline-offset: 2px;
            transition: border-color 2s;
        }

        input:focus {
            outline: 2px dashed blue;
        }

        input:placeholder-shown {
            border-color: red;
        }
    </style>
</head>

<body>



    <form>
        <label for="user-id">아이디</label>
        <input type="text" id="user-id" placeholder="특수 문자 포함 10자 이상">
    </form>



</body>
</body>

</html>
