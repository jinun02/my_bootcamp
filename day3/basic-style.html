<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* id selector 정의  */
        #container{
            width: 500px;
            margin: 10px auto;
        }

        /* p 요소 정의 */
        p{
            font-style: italic;
        }

        /* 클래스 정의 ..클래스는 .클래스로 정의한다*/
        .accent{
            border-width: 1px;
            border-style: solid;
            border-color: #000;

            border: 1px solid #000; /* 이렇게 합칠수 있다.*/
            padding: 5px;
        }
        .bg{
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <h1 class="accent bg ">레드향</h1>

        <p>껍질에 ... 블라... <span class="accent">레드향</span> 이라고....한다.</p>
        <p>레드향은 불러ㅡ,, 불러,, 불라</p>
        <p>아쨨든 비싸지만..</p>
    </div>
    
</body>
</html>
