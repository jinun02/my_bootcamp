<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 
        ::first-line : 블록 컨테이너 요소의 첫 번째 줄 선택하는 요
        주의 : 적용 대상은 반드시 블락 요소여야 합니다.
        ex> display 속성값이 bloc, inline-block, flex, inline-flex,grid, inline-grid,table
        등으로 설정된 블락 컨테이너에만 효과가 있음
        inline, contants 등 비 블락요소에는 적용 않됨.

    -->

    <style>
        p{
            max-width: 320px;

        }
        p::first-line{
            font-weight: bold;
            color: blueviolet;
            font-size: 1.4em;
        }
        p::selection{
            background-color: aqua;
            color: red;
        }
    </style>
</head>
<body>
    <p>
        :first-line : 블록 컨테이너 요소의 첫 번째 줄 선택하는 요
        주의 : 적용 대상은 반드시 블락 요소여야 합니다.
        ex> display 속성값이 bloc, inline-block, flex, inline-flex,grid, inline-grid,table
        등으로 설정된 블락 컨테이너에만 효과가 있음
        inline, contants 등 비 블락요소에는 적용 않됨.
        
    </p>
</body>
</html>
