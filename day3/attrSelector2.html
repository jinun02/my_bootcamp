<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--
        2. 속성=값 선택자 : [attr="value"] : 지정된 속성과 값이 일치하는 모든 요소 리턴함.
    -->
    <style>
        [target="_blank"]{
            background-color: blueviolet;
            color: white;
        }
    </style>
</head>
<body>
    <p>쉽고 재밌는 CSS <abbr title="HTML">HTML</abbr>을 배우기</p>
    <a href="https:www.wc2.org" title="공식 웹 사이트 " target="_blank">예시 사이트</a>
    <a href="https:www.wc2.org" title="공식 웹 사이트 ">예시 사이트</a>
</body>
</html>
