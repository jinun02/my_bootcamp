<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        /* 필드셋 의 BORDER을 지워라 */
        /* control-unit의 padding 0.5px border 1 solid silver, 모서리는 6px로 */

        fieldset {
            border: none;
        }

        .control-unit {
            padding: 0.5px;
            border: 1px solid silver;
            border-radius: 6px;
        }

        /* control-unit 요소와 형제관계를 가지는 control-unit을 선택하여 
        margin-botton 을 0.5em으로 정의하시오  */
        .control-unit:has(+ .control-unit){
            margin-bottom: 0.5em;
        }

        /* checked 상태인 요소와 조상관계를 가지는 .control-unit 요소를 선택하도록 선택자 정의 */
        .control-unit:has(:checked){
            border-color: red;
            accent-color: red;
        }
    </style>
</head>

</body>
<fieldset>
    <legend>관심이 있는 웹 언어를 선택하세요.</legend>
    <div class="control-unit">
        <input type="radio" id="html" name="web-lang">
        <label for="html">HTML</label>
    </div>
    <div class="control-unit">
        <input type="radio" id="css" name="web-lang" checked>
        <label for="css">CSS</label>
    </div>
    <div class="control-unit">
        <input type="radio" id="js" name="web-lang">
        <label for="js">JavaScript</label>
    </div>
</fieldset>
</body>

</html>
