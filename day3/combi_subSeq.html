<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* ~ :이후 선택자 ..A ~B라고 표기를 하면 A요소에서 이후에 
        위치한(반드시 버로 뒤에 올 필요는 없음) 모든 타깃 형제 요소인 선택자 B를 선택함*/
        h2~p{
            background-color: violet;
        }
    </style>
</head>

<body>
    <article>
        <h2>CSS 이후 형제 선택자</h2>
        <h3>h3</h3>
        <p>앞에서 지정한 요소 이후(반드시 바로 뒤에 올 필요는 없음)에 위치한 모든 타깃 형제 요소를 선택합니다.</p>
        <p>앞에서 지정한 요소 이후(반드시 바로 뒤에 올 필요는 없음)에 위치한 모든 타깃 형제 요소를 선택합니다.</p>
        <div>
            <p>형제 요소가 아닌 타깃 요소는 선택하지 않습니다.</p>
        </div>
        <p>앞에서 지정한 요소 이후(반드시 바로 뒤에 올 필요는 없음)에 위치한 모든 타깃 형제 요소를 선택합니다.</p>
    </article>

</body>

</html>
