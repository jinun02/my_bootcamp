    <!-- 
        removeChile() : 특정 부모 노드 내에서 지정한 자식 노드를 제거함
        이 매서드는 리턴값이 제거된 노드이기때문에 나중에 필요시 재 사용이 가능함.

        remove() : 최근에 추가된 메소드 원래는 부모 노드에서 자식을 지워야만 했는데, 
        자신이 자신을 삭제할때 사용할 수 있도록 제공된 메서드임
        리턴은  삭제된 노드임
    -->
</head>
