<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const now = new Date();

        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const date = String(now.getDate()).padStart(2, '0');

        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        // 2026-08-06 15:01:25 로 표시하도록
        const formatted = `${year}-${month}-${date} ${hours}:${minutes}:${seconds}`;
        console.log(formatted);

        // 다음과 같은 내용이 나오도록 아래의 함수를 구현 하시오
        function getDDay(targetDataString) {
            const target = new Date(targetDataString);

            const now = new Date();

            const fortaget = target - now; 

            const totalSeconds = Math.floor(fortaget / 1000);
            const days = Math.floor(totalSeconds / (60 * 60 * 24));
            const hours = Math.floor((totalSeconds % (60 * 60 * 24)) / (60 * 60));
            const minutes = Math.floor((totalSeconds % (60 * 60)) / 60);


            return `${targetDataString} 일 까지 ${days}일 ${hours}시간 ${minutes}분 남았습니다.`
        }
        console.log(getDDay("2026-12-25"));
    </script>
</body>

</html>
