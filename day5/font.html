<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 
        font : 글자의 스카일을 지정함
        style(기울임 스타일 지정), variant(소문자 작은 대문자로 변형)
        font-weight(굵기), size(크기), line-height(텍스트 라인 높이), font-family(요소의 글꼴 지정)

        ex> font-family "Nanum Gothic",sans-serif;
        //글꼴 지정.. 글꼴을 나열, 왼쪽->오른쪽으로 나열...","로 구분...
        "Nanum Gothic","맑은고딕", Helvetica, sens-serif
     -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        h2{
            font-style: italic;
            font-weight: 800;
            font-size: larger;
        }
        
    </style>
</head>

<body>
    <h2>안녕하세요</h2>

</body>

</html>
