<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 
        overflow : 요소의 컨텐츠가 커서 요소의 크기를 넘어설 때 발생한는 넘치는 내용에 대한 처리방식을 말한다
        값으로는 visible, hidden, scroll, auto, clip들이 있음.
    -->
    <style>
        p {
            width: 230px;
            height: 50px;
            padding: 20px;
            border: 3px dashed purple;
            background: rgba(2500, 0, 200, 0.14);
            overflow:scroll;
        }
    </style>
</head>

<body>
    <p>
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Dignissimos dolor doloribus magni maiores?
        Sint, asperiores totam debitis, magnam, magni voluptate sequi deserunt officia aliquid fuga saepe ipsam porro!
        Nemo, expedita.
    </p>
</body>

</html>
