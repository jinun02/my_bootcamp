<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a {
            text-decoration: none;
            color: #222;
        }

        #new-list {
            width: 1200px;
            margin: 0 auto;
            overflow: hidden; /* float 자식 높이 붕괴 방지 */
        }

        .title-text {
            text-align: center;
        }

        .title-text > h2 {
            font-size: 2.5em;
            color: #919191;
        }

        .travel-list {
            padding-top: 20px;
        }

        .card {
            margin: 10px;
            float: left;
            padding: 10px;
            position: relative; /* 오버레이 기준점 */
            overflow: hidden;   /* 오버레이가 카드 밖으로 안 나가게 */
            width: 300px;
        }

        .card img {
            width: 300px;
            height: 300px;
            margin: 30px;
        }

        /* 호버 시 나타날 정보 오버레이 */
        .card .info {
            position: absolute;
            left: 0;
            bottom: -100%;      /* 평소엔 카드 아래로 숨겨둠 */
            width: 100%;
            height: 100%;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.75);
            color: #fff;
            box-sizing: border-box;
            display: flex;
            transition: bottom 0.3s ease; /* 부드럽게 올라오는 애니메이션 */
        }

        .card:hover .info {
            bottom: 0; /* 호버하면 카드 안으로 올라옴 */
        }
    </style>
</head>

<body>
    <div id="new-list">
        <div class="title-text">
            <h2>신상품 목록</h2>
        </div>
        <div class="travel-list">
            <div class="card">
                <a href="#">
                    <img src="../imgs/book1.jpg">
                    <div class="info">
                        <h3>상품1</h3>
                        <p>어쩌고 저쩌고 어쩌고 저쩌고</p>
                    </div>
                </a>
            </div>
            <div class="card">
                <a href="#">
                    <img src="../imgs/book2.jpg">
                    <div class="info">
                        <h3>상품2</h3>
                        <p>어쩌고 저쩌고 어쩌고 저쩌고</p>
                    </div>
                </a>
            </div>
            <div class="card">
                <a href="#">
                    <img src="../images.jpeg">
                    <div class="info">
                        <h3>상품3</h3>
                        <p>가어쩌고 저쩌고 어쩌고 저쩌고</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
