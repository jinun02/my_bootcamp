<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 
        margin : 요소의 네 측면 경계와 바깥쪽 사이에 있는 여백을 뜻함.
        단위 : 백붙율, px....auto

        ex> margin : 20px 50px 40px (위, 오른쪽, 밑)
    -->
        <style>
            .p{
                border: 5px solid orange;
            }
            .c{
                background-color: lime;
                margin: 40px 20px 40px; 
            }
            .con{
                border: 5px solid violet;
            }
            .box{
                width: 100px;
                background: lime;
                text-align: center;
                margin: 0 auto;
            }
        </style>
</head>
<body>
    <div class="p">
        <div class="c">
            margin : 20px
        </div>

    </div>
    <div class="con">
        <div class="box">box</div>

    </div>
</body>
</html>
