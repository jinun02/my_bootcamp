<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 
        변화니 transition 요소의 이벤트에 따른 변환 효과를 주는 일종의 함수
        주요 속성으로는 변환요소 및 시간, delay 시간 등을 줄 수 있다.
    -->
        <style>
            div{
                width: 100px;
                height: 100px;
                background: red;
                transition: width 2s;
                transition-timing-function: linear;
                
            }
            div:hover{
                width: 300px;
            }
        </style>
</head>
<body>
    <div>

    </div>
    
</body>
</html>
