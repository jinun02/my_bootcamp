<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <p id="hello">환영.. 더운 날씨</p>

    <script>
        const changeColor = (color) => {
            const hello = document.getElementById('hello');
            hello.style.color = color;
        };


        // document.getElementsByTagName(); // 테그 이름을 기준으로 찾아냄
        // // 배열과 같은 HTMLCollection 을 리턴합니다.
        // //DOM 컬랙션이라고 합니다.
        // // for~of를 통해서 순회 가능한 객체입니다.

    </script>
    <button type="button" onclick="changeColor('red');">빨간색</button>
    <button type="button" onclick="changeColor('blue');">파란색</button>

    <hr>
    <ul>
        <li>A</li>
        <li>B</li>
        <li>C</li>
    </ul>
    <ul>
        <li class="a">가</li>
        <li class="a b c">나</li>
        <li class="a b">다</li>
    </ul>
    <hr>

     <h2>분식점 메뉴</h2>
        <ul>
            <li>김밥</li>
            <li>라면</li>
            <li>떡볶이</li>
        </ul>
        <h2>중국집 메뉴</h2>
        <div id="cn-food">
            <ul>
                <li class="k">짜장면</li>
                <li class="k">짬뽕</li>
                <li class="k">탕수육</li>
            </ul>
        </div>

    <button id="mybtn"> 클릭하세요 </button>

    <ul id="my-list"></ul>

   
    <script>
        const listEles = document.getElementsByTagName('li');
        console.log(listEles);

        listEles
        for (const listEle of listEles) {
            console.log(listEle.textContent);
        }

        // rest 문법을 이용하여 arr 이라는 배열변수에 listEles 의 새로운 배열을 생성해보세요
        const arr = [...listEles];
        arr.forEach(li => {
            console.log(li.textContent);
        }); // 전체를 순환할수 있음


        // 위 방법 말고 lisrEles를 담은 새 배열로 생성하는 방법
        const arr2 = Array.from(listEles);
        console.log(arr2);


        const clsCollection = document.getElementsByClassName("a b");
        // 각 노드를 출력해보세요
        console.log(clsCollection[0].textContent);


        // 짜장면만 콘솔에 찍히도록
        const meuu = document.getElementsByClassName("k");
        for(const el of meuu){
            console.log(el)
        }
        console.log(meuu[0].textContent); // 짜장면


        // querySelector("선택자") : 문서 전체에서 선택자와 일치하는 첫 번째 요소를 리턴함
        // 없으면 NUll 리턴함.
        const btn = document.querySelector("#mybtn");
        btn.addEventListener("click",()=>{
            alert('버튼눌림');
        })

        // 동적으로 ul하위의 li 요소 추가및 li의 냐용 추가하기...
        const items = ["항목1","항목2","항목3"];
        const itemsLeng=items.length;
        const my_list=document.querySelector("#my-list");

        for(let i =0; i<items.length; i++){
            let listItem=document.createElement("li");
            listItem.textContent=items[i];
            my_list.appendChild(listItem);
        }


        // querySelectorALL() : 문서나 특정 요소내에서 지정한 css 선택자와 일치하는 모든 요소 리턴
        // 리턴타입은 Nodelist임.. 찾지못하면 empty Nodelist를 반환함.
        const qsAll= document.querySelectorAll("li");
        console.log(qsAll);
    </script>

</body>

</html>
