<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .slide {
            display: none;
            padding: 20px;
            background-color: yellowgreen;
            text-align: center;
            font-size: 24px;
        }

        .slide.active {
            display: block;
        }
    </style>
</head>

<body>
    <!-- 
        previousElementSibling : 현재요소의 바로 이전 형제 요소를 반환함
        nextElementSibling : 현재요소의 다음 형제 요소를 반환함.
    -->

    <div class="carousel">
        <div class="slide">Slide 1</div>
        <div class="slide">Slide 2</div>
        <div class="slide active">Slide 3</div>
    </div>
    <br>
    <button id="prevBtn">이전 슬라이드 보기</button>

    <script>
        // 위 코드는 슬라이드 입니다. (케러샐)
        // 이전 보기를 하면 이전슬라이드가 보이고
        // 만약 마지막 슬라이드인 경우에는 alert를 띄워서 마지막 슬라이드입니다,를 출력시시세요
        // 참고로 스타일 클래스를 추가하는 매세드는 add()입니다

        document.getElementById("prevBtn").addEventListener("click", () => {
            const currentSlide = document.querySelector(".slide.active");
            const prevSlide = currentSlide.previousElementSibling;
        
            if(prevSlide){
                currentSlide.classList.remove("active");
                prevSlide.classList.add("active");
        } else {
            alert("마지막 슬라이드입니다.");
        }

        });
    </script>
</body>

</html>
