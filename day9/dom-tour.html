<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom 순회 해서 요소를 찾아내기</title>
    <style>
        .highlight {
            background-color: yellow;
        }
    </style>
</head>

<body>
    <!-- 
    closest() : 주어진 선택자와 일치하는 가장 가까운 조상요소를 찾아서 반환함.
    이떄 자신도 검사 대상에 포함됨.

    parentElement(이건 속성임) : 현재 노드의 부모 요소를 반환합니다.
    // 여기서 말하는 요소는 노드를 뜻 합니다. <li><p> 같은...
    만약 p 내부에 있는 텍스트 지칭 할때는 텍스트 노드라고 지칭하게 됩니다.

    children : 특정 요소의 자식 요소들을 HTMLCollection으로 리턴합니다.

    // firstElementChild : 첫번째 자식 요소 리턴함.. 반대는 last.. 가 없음.

    -->

    <section>
        <div id="div-01" class="container">
            <div id="div-02" class="container">
                <div id="me">me</div>
            </div>
        </div>

        <div id="parent">
            <p id="child">여기 자식 노드의 텍스트</p>
        </div>

        <div style="background-color: aliceblue; padding: 20px;">
            <button type="button" id="btn">클릭</button>
        </div>

        <ul id="fruits">
            <li>사과</li>
            <li>바나나</li>
            <li>복숭아</li>
        </ul>

        <button type="button" id="firstChildBtn">첫 번째 자식 요소 글자 색상 변경</button>
        <button type="button" id="oddBtn">홀수 항목만 색을 바꿔보세요</button>
        <button type="button" id="lastChildBtn">마지막 자식 요소 컬러변경하기</button>

        <script>
            const me = document.getElementById("me");
            console.log(me.closest(".container"));
            console.log(me.closest("section > div"));
            console.log(me.closest("div"));
            console.log(me.closest("p"));

            const child = document.getElementById("child");
            console.log(child.parentElement);
            console.log(child.parentNode);

            const btn = document.getElementById("btn");
            btn.addEventListener('click', function () {
                this.parentElement.style.background = 'yellow';
            });

            // 첫 번째 자식 요소(사과) 글자 색상 변경
            document.getElementById("firstChildBtn").addEventListener("click", () => {
                const fruits = document.getElementById("fruits");
                fruits.children[0].style.color = "red"; // children[0] = 첫 번째 li (사과)
            });

            // 홀수 항목만 색 바꾸기
            document.getElementById("oddBtn").addEventListener("click", () => {
                const items = document.querySelectorAll("#fruits li");
                items.forEach((item, index) => {
                    if (index % 2 === 0) {
                        item.style.backgroundColor = "yellow";
                    }
                })});

                // 마지막 자식 요소(복숭아) 하이라이트로 색 변경
                document.getElementById("lastChildBtn").addEventListener("click", () => {
                    const fruits = document.getElementById("fruits");
                    fruits.lastElementChild.classList.add("highlight");
                });
        </script>
    </section>
</body>

</html>
