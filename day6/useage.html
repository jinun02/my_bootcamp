<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*---------BODY-----------------------*/
        body {
            background-color: #dedede;
        }

        /*------Container----------------------*/
        .container {
            overflow: hidden;
        }

        /*-----------TITLES-------------------*/
        /*-------heading--------*/

        #heading h2 {
            font-family: Segoe UI;
            font-size: 35px;
            color: #242525;
            margin: 15px 10px 5px 50px;
            text-align: center;
        }

        #heading p {
            text-align: center;
            font-family: Segoe UI;
            font-size: 18px;
            color: #105cb1;
            text-shadow: none;
        }

        h3 {
            font-family: segoe UI;
            color: #fff;
            color: #242525;
            text-decoration: underline;
        }

        /*------all button style--------*/


        button:hover {
            cursor: pointer;
            transition: background-color 0.5s, color 0.5s;

        }

        /*------Rectangular Buttons-----------*/

        .rectangular button {
            padding: 15px 64px;
            margin: 30px 25px 30px 25px;
            display: inline-block;
            font-family: segoe UI;
            font-size: 14px;
            outline: none;
            color: #fff;
            font-weight: bold;
        }

        /*----------Rectangular Buttons 2 ----------*/
        .rectangular_2 button {
            padding: 15px 64px;
            margin: 30px 25px 30px 25px;
            display: inline-block;
            font-family: segoe UI;
            font-size: 14px;
            outline: none;
            color: #fff;
            font-weight: bold;
        }


        /*-------Round Buttons------------*/

        .round button {
            padding: 15px 64px;
            margin: 30px 25px 30px 25px;
            display: inline-block;
            font-family: segoe UI;
            font-size: 14px;
            outline: none;
            color: #fff;
            border-radius: 40px;
        }

        /*-------Round Buttons 2------------*/
        .round_2 button {
            padding: 15px 64px;
            margin: 30px 25px 30px 25px;
            display: inline-block;
            font-family: segoe UI;
            font-size: 14px;
            outline: none;
            color: #fff;
            border-radius: 30px;
            font-weight: bold;
        }

        /*-----------button style--------*/

        #Flamingo {
            background: #ef4836;
            border: 2px solid #ef4836;
        }

        #Flamingo:hover {
            background: #fff;
            border-color: #ef4836;
            color: #ef4836;
        }

        #Flamingo:active {
            background: #fff;
            border-color: #fff;
        }

        #Picton {
            background: #59abe3;
            border: 2px solid #59abe3;
            font-weight: bold;
        }

        #Picton:hover {
            background: #fff;
            color: #59abe3;
        }

        #Picton:active {
            background: #fff;
            border-color: #fff;
        }
    </style>
</head>

<body>
    <div class="container">

        <div id="heading">
            <h2>FLAT UI BUTTONS </h2>
            <p>Version 1.0</p>
        </div>

        <div class="rectangular">
            <h3>Rectangular</h3>
            <button id="Flamingo">CLICK ME </button>
            <button id="Picton">CLICK ME</button>
            <button id="Gossip">CLICK ME</button>
            <button id="Edward">CLICK ME</button>
            <button id="Sandstorm">CLICK ME</button>
        </div>

        <div class="rectangular_2">
            <button id="Flamingo_2">CLICK ME</button>
            <button id="Picton_2">CLICK ME</button>
            <button id="Gossip_2">CLICK ME</button>
            <button id="Edward_2">CLICK ME</button>
            <button id="Sandstorm_2">CLICK ME</button>
        </div>

        <div class="round">
            <h3>Pill Shaped</h3>
            <button id="Flamingo">CLICK ME</button>
            <button id="Picton">CLICK ME</button>
            <button id="Gossip">CLICK ME</button>
            <button id="Edward">CLICK ME</button>
            <button id="Sandstorm">CLICK ME</button>
        </div>

        <div class="round_2">
            <button id="Flamingo_2">CLICK ME</button>
            <button id="Picton_2">CLICK ME</button>
            <button id="Gossip_2">CLICK ME</button>
            <button id="Edward_2">CLICK ME</button>
            <button id="Sandstorm_2">CLICK ME</button>
        </div>



        <div id="footer">
            <div id="credit">
                <p>Designed by → <a href="https://www.twitter.com/MayurElbhar">Mayur Elbhar (ME)</a>
            </div>

        </div>
    </div>
    </div>
</body>

</html>
