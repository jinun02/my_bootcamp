<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css?family=Faster+One" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>


    </header>

    <section>

    </section>

    <script>
    //JSON 데이터를 가져오기위한 URL 초기화 합니다.
    const requestURL='https://mdn.github.io/learning-area/javascript/oojs/json/superheroes.json';
    // 위 URL에 접속부터 해야합니다... request한다고 하는데, 자바스크립트계열에서는 fetching 한거나
    // XMLHttpRequest 한다라고 하빈다. 얘는 내부적으로 스크립트 객체로 구성되어져 있습니다
    const request=new XMLHttpRequest();
    
    // XHR 객체를 생성했으면 open()을 이용해서 요청을 만들어줍니다.
    request.open("GET",requestURL);
    // MINE 타입을 지정합니다.
    request.responseType='json'
    request.send();

    console.log(request);
    // XHR 에서 요청과 응답이 잘 이뤄졌다면, 내부적으로 호출이 되는 콜백 핸들러가 있습니다.
    // onload라는 핸들러입니다.
    request.onload=function(){
        let superheroes=request.response;

        // heroes 의 해더와 본문을 구성하는 함수에 각각 데이터를 넣어주고 호출해줍니다.
        populateHeader(superheroes);
        showHerose(superheroes);
    }
    function showHerose(jsonObj){
        const heroes=jsonObj["members"];
        const section=document.querySelector('section');


        for(let i =0;i<heroes.length;i++){
            let myArticle =document.createElement('article');
            let myH2=document.createElement('h2')
            let myPara1=document.createElement('p')
            let myPara2=document.createElement('p')
            let myPara3=document.createElement('p')
            let mylist=document.createElement('ul')

            myH2.textContent=heroes[i].name;
            myPara1.textContent="암호명 : "+heroes[i].secretIdentity;
            myPara2.textContent="나이"+heroes[i].age;
            myPara3.textContent="Super powers : ";


            const superPowers=heroes[i].powers;
            for(const power of superPowers){
                const listItem=document.createElement('li');
                listItem.textContent=power;
                mylist.appendChild(listItem);
            }


            myArticle.appendChild(myH2);
            myArticle.appendChild(myPara1);
            myArticle.appendChild(myPara2);
            myArticle.appendChild(myPara3);
            myArticle.appendChild(mylist);

            section.appendChild(myArticle);

        }
    }



    function populateHeader(jsonObj){
        const header=document.getElementsByTagName("header");
        const myH1=document.createElement("h1");
        myH1.textContent= jsonObj["squadName"];
        console.log(header);
        header[0].appendChild(myH1);

        const myPara=document.createElement('p');
        myPara.textContent="Hometown: "+jsonObj["homeTown"]
        +"// Formed"+jsonObj["formed"];

        header[0].appendChild(myPara);
    }
    

    </script>

</body>

</html>
