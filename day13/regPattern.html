    <!-- 
        자바스크립트 정규화 식 : 정규화란 문자열 내의 특징 패턴을 검증해서, 검증 결과를 리턴 받거니
        해서 사용하는 문자열 객체 또는 정규화식 객체를 뜻합니다.
        정규화식은 자바스크립트 뿐 아니라 대부분의 프로그램 언어에서도 사용되니 한번만 잘 이해하면 이후에 
        더 공부할 일은 없을듯 하지만 , 대부분은 AI또는 구글을 통해 필요한 부분만 얻어서 활용을 합니다.

        ('문자열').mathch(/정규식/플래그) : 문자열에서 정규식에 매칭하는 항목들을 배열로 변환하는 매서드
        ('문자열').replace(/정규식,'대체문자열') : 정규식에서 매칭되는 항목을 대체문자열로 변환
        ('문자열').split('정규식') : 문자열을 정규식에 매칭되는 항목으로 쪼개서 배열로 리턴
        ('정규식').test('문자열') : 문자열이 정규식과 매치되면 true, 아니면 false를 리턴함.


        ragular expression : 정규식 (정규식의 패턴은 // // 사이에 넣습니다)

        정규식 플래그 : 정규식을 생성할때 향상된 검새을 위한 전역 옵션을 설정할 수 있도록 하는 기능임.
        
        플래그의 종류는 대략 5가지 정도 있는데, 많이 사용되는 것만 알아봅시다.
        i : 대소문자를 구분하지 않고 검색하는 플래그
        g : global의 약자로 문자열 내의 모든 패턴을 검색
        m : multi line의 약자로 행이 바뀌어도 검색하라는 의미, 만약 검색플래그가 없는경우 최초의 한번만 검색해서 반환하는 반면
            플래그가 존재하면, 모든 검색 결과를 반환함.
        
        // ^ $ : 순서대로 시작이나 끝을 나타내는 기호입니다.
        // 위 표식자는 하나의 줄에 매핑되어서 검색을 하기 때문에, 여러줄을 대상으로 검색할때는 문제가 발생함.
        // 이때 m flag를 지정해서 다중라인을 대상으로 검색한다. 

        // - : 범위를 뜻함.. ex> a-z A-Z, ㄱ-ㅎ가-힣
        // 0-9: 숫자로 되어있는지.
        // . : 모든 문자열을 뜻함.. 숫자, 한글, 영어, 특수기호, 공백 모두가 매치됨.
        // d : 숫자에 대응
        // /d : 숫자가 아닌것에 대응
        // /w : 영숫자 문자에 대응[A-Za-z0-9] 와 동일함.
        // /W : /w 가 아닌것에 대응
        // /s : spade와 대응 (공백문자)
        // /S : 공백이 아닌것
        // /특수기호 : 특수기호에 매칭
        // /b : 영대소문자, 숫자 10개 가 아닌 나머지 문자에 일치하는 경계
        // /B : 63개문자(영대소문자, 숫자10) 와 일치하는 경계

        // msg에서 한글, 영문 숫자, 공백을 제외한 특수문자만 찾아보세요

        // 기호의 의미
        // ? : 없거나 최대 1개 미만
        // * : 없거나 있거나(여러개)
        // + : 최소 한개 or 여러개
        // *? : 없거나 있거나 최대 한개{0}과 동일
        // {n} : n개 존재
        // . : 모든 문자열
    -->
