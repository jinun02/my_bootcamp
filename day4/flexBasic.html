<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 
    flex box 만들기 : 윈하는 컨테이너에 disply속성을 flex or inline-flex로 설정하면 
    자동으로 배치가 시작된다.

    flex 컨테이너에 배치된 요소들은 플렉스 아이템이라고 히며, 또다시 개별 속성을 가질수 있다.

    flexbox 로 생성된 컨테이너에는 다음과 같은 속성을 제어 할 수 있다. (플랙스 흐름 방향과, 아이템의 배치 결정을 고려한 속성이 존재한다.)

    flex-direction: 주축의 방향 설정 속성
    flex-wrap : 플랙스 컨테이너의 줄바꿈 설정
    gap : 아이탬간의 간결 설정
    justify-contant : 주축을 기준으로 아이탬의 정렬 방식 설정
    align-items : 교차축을 기준으로 아이탬의 정렬 방식 설정
    align-contant : 여러축일때 교차축 정렬방식을 설정함

    -->
    <style>
        .flex-container {
            display: flex;
            border: 2px solid #000;
            padding: 10px;
            gap: 10px;
            justify-content: center;
        }

        .flex-item {
            background-color: violet;
            color: red;
            padding: 10px;
        }


        .block-container{
            border: 2px solid #000;
            padding: 10px;

        }
        .inline-flex-container{
            display: inline-flex;
            border: 2px solid #333;
            gap: 10px;
            justify-content: center;
            padding: 10px;
        }

    </style>
</head>

<body>
    <div class="flex-container">
        <div class="flex-item">child1</div>
        <div class="flex-item">child2</div>
        <div class="flex-item">child3</div>
    </div>

    <div class="block-container">
        <span>일반 텍스트 앞</span>
        <div class="inline-flex-container">
            <div class="flex-item">child 1</div>
            <div class="flex-item">child 2</div>
            <div class="flex-item">child 3</div>
        </div>
        <span>일반 텍스트 뒤</span>
    </div>

</body>

</html>
