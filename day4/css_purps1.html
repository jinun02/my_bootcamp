<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 
    CSS 속성 요소들 : 글자 크리부터 이미지 배치 및 관리까지...CSS에 사용되는 필수 속성들을 알아봅시다.

    background : 요소의 배경 스타일을 한번에 지정하는 속성임....
    -->

    <style>
        [type="checkbox"]{
            width: 50px;
            height: 50px;
            accent-color: red;
        }
        /* p{ */
            /* background: ; color, image -----; */
        /* } */

        div{
            height: 200px;
            border: 10px dashed green;
            background-image: linear-gradient(rgba(0,0,255,0.1),rgba(255,255,0,0.1)),
            radial-gradient(green,pink);
        }
    </style>
</head>

<body>
    <p>체크되어 있지 않은 체크박스</p>
    <input type="checkbox">
    <hr>
    <p>체크되어 있는 체크박스</p>
    <input type="checkbox" checked>

    <div>

    </div>
</body>

</html>
