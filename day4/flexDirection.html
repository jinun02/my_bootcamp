<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 
    flex directiom : 플랙스 컨테이너의 주축 방향의 설정을 하는 속성.
    플랙스 아이탬이 컨테이너 내에 배치되는 흐름 방향을 지정함.    
    
    wrap : 컨테이너에 아이탬이 꽉 차있는 경우 채울지 새로운 라인에 배치할지를 결정하는 요소임
    기본적으로 한줄에 꽉채워서 배치하려고 함.
    -->

    <style>
        .flex-container{
            display: flex;
            border: 2px solid #000;
            padding: 10px;
            gap: 0 20px;
            flex-wrap: wrap;
            flex-direction: column;
            justify-content: end;
            height: 1000x;
    
        }

         .item {
            background-color: violet;
            border: 4px solid blue;
        }

    
        .site-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1em 2em;
            background-color: violet;
        }
        .logo{
            font-weight: bold;
            color: blue;
            text-decoration: none;
        }
        .user-action{
            margin-left: 1.5em;
            color: #000;
            text-decoration: none;
            font-size: 0.9em;
        }
        .user-action .btn-signup{
            padding: 0.5em 1em;
            background-color: aqua;
            color: #000;
            border-radius: 4px;
        }
    </style>
</head>

<body>


    <header class="site-header">
        <div class="logo">
            <a href="">logo위치</a> 
        </div>
        <div class="user-action">
            <a href="">로그인</a> 
            <a href="" class="btn-signup">회원가입</a> 
        </div>
    </header>
    <div class="flex-container">
        <div class="item">Item-1</div>
        <div class="item">Item-2</div>
        <div class="item">Item-3</div>
        <div class="item">Item-1</div>
        <div class="item">Item-2</div>
        <div class="item">Item-3</div>
        <div class="item">Item-1</div>
        <div class="item">Item-2</div>
        <div class="item">Item-3</div>
        <div class="item">Item-1</div>
        <div class="item">Item-2</div>
        <div class="item">Item-3</div>
    </div>

</body>

</html>
